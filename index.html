<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050506">
<title>The Archive | Curated Collection</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050506'/%3E%3Crect x='.75' y='.75' width='30.5' height='30.5' rx='6.5' fill='none' stroke='%23D4AF37' stroke-opacity='.45' stroke-width='1.5'/%3E%3Cg transform='translate(4 4) scale(1.0)' fill='none' stroke='%23D4AF37' stroke-width='1.8' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --base:#050506;--surface:rgba(18,18,24,.65);
  --gold:#D4AF37;--gold-light:#F3E5AB;--gold-muted:rgba(212,175,55,.4);--gold-glow:rgba(212,175,55,.2);
  --text:#F7F7F7;--text-dim:#A0A0A5;--border:rgba(255,255,255,.1);
  --serif:'Playfair Display',serif;--sans:'Montserrat',sans-serif;--ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--base);color:var(--text);scrollbar-gutter:stable}
body{margin:0;font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:var(--base)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold-muted);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:var(--gold)}
button{font:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#bg,.vignette{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none}
#bg{z-index:0}
.vignette{z-index:1;background:radial-gradient(circle at center,transparent 15%,rgba(5,5,6,.92) 100%)}
.app{position:relative;z-index:10}

nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(5,5,6,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1600px;margin:0 auto;padding:16px 40px}
.logo{font:600 20px var(--serif);letter-spacing:2px;color:var(--gold);text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:12px;width:max-content}
.logo svg{width:24px;height:24px;fill:none;stroke:var(--gold);stroke-width:1.5}

.hero{position:relative;z-index:95;height:55vh;min-height:400px;display:flex;justify-content:center;align-items:center;text-align:center;background:linear-gradient(transparent,rgba(5,5,6,.9))}
.hero::before,.utility::after{content:"";position:absolute;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 50%,transparent)}
.hero::before{left:8%;right:8%;box-shadow:0 0 14px var(--gold-glow)}
.hero::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:var(--base);border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 12px var(--gold-glow)}
.hero-content{padding:0 20px;animation:up 1.2s var(--ease) both}
.hero-sub{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:24px;display:block}
.hero-title{font:500 clamp(32px,6vw,72px)/1.1 var(--serif);margin:0;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.hero-title i{color:var(--gold-light)}
.hero-stats{display:flex;gap:40px;justify-content:center;margin:40px auto 0;border-top:1px solid var(--gold-muted);padding-top:30px;width:max-content}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat b{font:400 24px var(--serif);color:var(--gold)}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim)}
@keyframes up{from{opacity:0;transform:translateY(20px)}}

.utility{max-width:1600px;margin:0 auto;padding:40px 40px 20px;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center;position:sticky;top:65px;z-index:90;background:rgba(5,5,6,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.utility::after{left:40px;right:40px;opacity:.45}
.search{position:relative;width:100%;max-width:400px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--text-dim);fill:none;transition:stroke .4s}
.search:focus-within svg{stroke:var(--gold)}
#search{width:100%;background:rgba(20,20,26,.8);border:1px solid var(--border);color:var(--text);font:13px var(--sans);padding:12px 16px 12px 44px;border-radius:4px;transition:all .4s var(--ease)}
#search:focus{outline:0;border-color:var(--gold);box-shadow:0 0 15px var(--gold-glow);background:rgba(25,25,32,.95)}
#search::placeholder{color:var(--text-dim)}

.tabs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:rgba(20,20,26,.7);border:1px solid var(--border);color:var(--text-dim);padding:8px 24px;border-radius:40px;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .4s var(--ease);white-space:nowrap}
.tab:hover{border-color:var(--gold-muted);color:var(--text)}
.tab.active{background:var(--gold);border-color:var(--gold);color:var(--base);font-weight:600}

.container{max-width:1600px;margin:0 auto;padding:20px 40px 100px}
#gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:32px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .5s var(--ease)}
.card:hover{border-color:var(--gold-muted);transform:translateY(-4px);box-shadow:0 15px 35px rgba(0,0,0,.6),0 0 20px var(--gold-glow);background:rgba(30,30,38,.9)}
.card[hidden]{display:none}
.thumb{aspect-ratio:4/3;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;filter:grayscale(15%);transition:opacity .8s,transform 1s var(--ease),filter .5s}
.thumb img.ready{opacity:1}
.card:hover .thumb img{transform:scale(1.05);filter:none}
.info{padding:20px;display:flex;flex-direction:column;gap:8px;flex:1}
.folder{font:italic 11px var(--serif);color:var(--gold);letter-spacing:1px}
.name{margin:0;font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:12px;margin-top:auto;padding-top:16px;border-top:1px solid var(--border)}
.act{background:none;border:0;padding:0;color:var(--text-dim);cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;text-decoration:none;transition:color .3s}
.act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.act:hover{color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;padding:100px 20px;font:italic 24px var(--serif);color:var(--text-dim)}

dialog{border:0;padding:0;background:rgba(5,5,6,.95);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);width:100vw;max-width:100vw;height:100vh;max-height:100vh;color:var(--text)}
dialog[open]{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0}}
.lb{height:100%;display:flex;flex-direction:column;padding:20px 40px}
.lb-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px}
#lb-title{font:400 20px var(--serif);color:var(--gold);margin:0}
#lb-count{font-size:12px;color:var(--text-dim);letter-spacing:2px}
.round{background:rgba(20,20,26,.8);border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:all .3s}
.lb-close{width:40px;height:40px;background:transparent;color:var(--text)}
.lb-close:hover{border-color:var(--gold);color:var(--gold)}
.lb-close svg{width:20px;height:20px}
.stage{flex:1;position:relative;display:flex;justify-content:center;align-items:center;min-height:0}
.stage img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.9)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);width:50px;height:50px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lb-nav:hover{background:var(--gold);color:var(--base)}
.lb-nav.prev{left:0}.lb-nav.next{right:0}
.lb svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.lb-nav svg{width:24px;height:24px}

#toast{position:fixed;bottom:40px;left:50%;transform:translate(-50%,20px);background:var(--gold);color:var(--base);padding:12px 32px;border-radius:4px;font:600 12px var(--sans);letter-spacing:1px;text-transform:uppercase;box-shadow:0 10px 30px var(--gold-glow);opacity:0;pointer-events:none;transition:all .5s var(--ease);z-index:1000}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:768px){
  .hero-stats{gap:20px}
  .nav-inner,.utility,.container{padding-inline:20px}
  .utility::after{left:20px;right:20px}
  #gallery{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .lb{padding:20px}
  .lb-nav{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){
  *,::before,::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette"></div>

<div class="app">
  <nav><div class="nav-inner">
    <a href="#" class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      The Archive
    </a>
  </div></nav>

  <header class="hero"><div class="hero-content">
    <span class="hero-sub">Bespoke Visual Asset Collection</span>
    <h1 class="hero-title">Curated <i>Elegance</i></h1>
    <div class="hero-stats">
      <div class="stat"><b id="stat-total">0</b><span>Assets</span></div>
      <div class="stat"><b id="stat-folders">0</b><span>Collections</span></div>
    </div>
  </div></header>

  <div class="utility">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Discover assets..." autocomplete="off" aria-label="Search assets">
    </div>
  </div>

  <main class="container"><div id="gallery"></div></main>
</div>

<dialog id="lightbox">
  <div class="lb">
    <div class="lb-head">
      <div><h3 id="lb-title"></h3><span id="lb-count"></span></div>
      <button class="round lb-close" id="lb-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="stage">
      <button class="round lb-nav prev" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <img id="lb-img" alt="">
      <button class="round lb-nav next" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </div>
</dialog>

<div id="toast" role="status"></div>

<script>
/* ---------- Obsidian background ----------
   Procedural volcanic glass: three layers of Voronoi facets, each facet gets a
   random surface normal, then it is lit by two lights with sharp specular
   highlights. Cracks form where facets meet. Rendered once at half resolution. */
(() => {
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const SCALE = .5;
  const LAYERS = [[1/9, 1.1, 1], [1/21, .75, .8], [1/52, .45, .6]]; // [cell size / max(w,h), tilt, tone weight]

  const hash = (x, y, s) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  };
  const norm = (v, a, b, c) => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  const L1 = norm([-.55, -.6, .58]), L2 = norm([.7, .25, .66]);
  const H1 = norm([L1[0], L1[1], L1[2] + 1]), H2 = norm([L2[0], L2[1], L2[2] + 1]);

  function draw() {
    const w = cv.width = Math.ceil(innerWidth * SCALE), h = cv.height = Math.ceil(innerHeight * SCALE);
    const img = ctx.createImageData(w, h), px = img.data, big = Math.max(w, h);
    const cells = LAYERS.map(([f, t, k], i) => ({ s: Math.max(8, big * f), t, k, seed: i * 7919 + 13 }));

    for (let y = 0, p = 0; y < h; y++) for (let x = 0; x < w; x++, p += 4) {
      let nx = 0, ny = 0, tone = 0, wsum = 0, edge = 9;

      for (const c of cells) {
        const gx = Math.floor(x / c.s), gy = Math.floor(y / c.s);
        let d1 = 1e9, d2 = 1e9, bx = 0, by = 0;
        for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
          const cx = gx + i, cy = gy + j, r = hash(cx, cy, c.seed);
          const dx = (cx + (r & 255) / 255) * c.s - x, dy = (cy + ((r >>> 8) & 255) / 255) * c.s - y;
          const d = dx * dx + dy * dy;
          if (d < d1) { d2 = d1; d1 = d; bx = cx; by = cy; } else if (d < d2) d2 = d;
        }
        const r = hash(bx, by, c.seed), r2 = hash(bx, by, c.seed + 99);
        nx += (((r >>> 16) & 255) / 127.5 - 1) * c.t;
        ny += (((r >>> 24) & 255) / 127.5 - 1) * c.t;
        tone += ((r2 & 255) / 255) * c.k; wsum += c.k;
        edge = Math.min(edge, (Math.sqrt(d2) - Math.sqrt(d1)) / (c.s * .06));
      }

      const il = 1 / Math.hypot(nx, ny, 1), n0 = nx * il, n1 = ny * il, n2 = il;
      const diff = Math.max(0, n0 * L1[0] + n1 * L1[1] + n2 * L1[2]);
      const sp1 = Math.pow(Math.max(0, n0 * H1[0] + n1 * H1[1] + n2 * H1[2]), 70);
      const sp2 = Math.pow(Math.max(0, n0 * H2[0] + n1 * H2[1] + n2 * H2[2]), 90);
      const t = tone / wsum, tt = t * t;
      const lit = (.22 + .78 * diff) * Math.min(1, .35 + edge * .65); // dark cracks along facet borders
      const spec = (sp1 * .9 + sp2 * .6) * Math.min(1, edge);

      // smoky brown-black glass, with cold blue-grey reflections
      px[p]     = Math.min(255, (13 + 22 * tt) * lit * 1.5 + spec * 150);
      px[p + 1] = Math.min(255, (10 + 36 * tt) * lit * 1.5 + spec * 175);
      px[p + 2] = Math.min(255, (11 + 56 * tt) * lit * 1.5 + spec * 205);
      px[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }

  let w0 = innerWidth, timer;
  draw();
  addEventListener('resize', () => {
    if (innerWidth === w0) return; // ignore mobile URL-bar height changes
    w0 = innerWidth; clearTimeout(timer); timer = setTimeout(draw, 250);
  });
})();

/* ---------- Gallery ---------- */
const USER = "Jey-s", REPO = "Image-Library", BRANCH = "Images";
const BASE = `https://${USER}.github.io/${REPO}/`;
const IMG_RE = /\.(jpe?g|png|gif|webp|avif|svg|bmp)$/i;
const ICON = {
  copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  link: '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>'
};

const $ = id => document.getElementById(id);
const gallery = $("gallery"), search = $("search"), tabs = $("tabs"),
      lightbox = $("lightbox"), lbImg = $("lb-img"), toast = $("toast");
let items = [], view = [], folder = "All", current = 0, toastTimer;

const urlFor = p => BASE + p.split("/").map(encodeURIComponent).join("/");
const el = (tag, cls, html) => Object.assign(document.createElement(tag), { className: cls || "", innerHTML: html || "" });

function say(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

async function copyURL(path) {
  try { await navigator.clipboard.writeText(urlFor(path)); say("Asset Link Copied"); }
  catch { prompt("Manual Copy Required:", urlFor(path)); }
}

async function load() {
  try {
    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`);
    if (!res.ok) throw new Error("Unable to authenticate with the archive.");
    const { tree } = await res.json();
    items = tree.filter(f => f.type === "blob" && IMG_RE.test(f.path)).map(f => {
      const parts = f.path.split("/"), name = parts.pop();
      return { path: f.path, name, dir: parts.join("/") || "Archive", top: parts[0] || "Archive", url: urlFor(f.path) };
    });
    buildTabs();
    buildCards();
    filter();
  } catch (e) {
    gallery.replaceChildren(Object.assign(el("div", "empty"), { textContent: e.message }));
  }
}

function buildTabs() {
  const counts = new Set(items.map(f => f.top));
  $("stat-total").textContent = items.length;
  $("stat-folders").textContent = counts.size;
  tabs.replaceChildren(...["All", ...[...counts].sort()].map(name => {
    const b = el("button", "tab" + (name === folder ? " active" : ""));
    b.textContent = b.dataset.f = name;
    return b;
  }));
}

function buildCards() {
  const frag = document.createDocumentFragment();
  for (const f of items) {
    const card = f.el = el("article", "card");
    card._f = f;
    const thumb = el("div", "thumb"), img = new Image();
    img.loading = "lazy"; img.decoding = "async"; img.alt = f.name;
    img.onload = () => img.classList.add("ready");
    img.src = f.url;
    thumb.append(img);

    const info = el("div", "info", `<span class="folder"></span><h3 class="name"></h3>
      <div class="actions"><button class="act" data-copy>${ICON.copy} Copy</button>
      <a class="act" target="_blank" rel="noopener">${ICON.link} View</a></div>`);
    const [dir, name] = [info.children[0], info.children[1]];
    dir.textContent = f.dir; name.textContent = name.title = f.name;
    info.querySelector("a").href = f.url;

    card.append(thumb, info);
    frag.append(card);
  }
  const empty = el("div", "empty", "No assets match your criteria.");
  empty.hidden = true;
  gallery.replaceChildren(frag, empty);
}

function filter() {
  const q = search.value.trim().toLowerCase();
  view = items.filter(f => (folder === "All" || f.top === folder) && f.path.toLowerCase().includes(q));
  const shown = new Set(view);
  for (const f of items) f.el.hidden = !shown.has(f);
  gallery.lastElementChild.hidden = view.length > 0;
}

function showAt(i) {
  if (!view.length) return;
  current = (i + view.length) % view.length;
  const f = view[current];
  lbImg.src = f.url;
  lbImg.alt = f.name;
  $("lb-title").textContent = f.name;
  $("lb-count").textContent = `${String(current + 1).padStart(2, "0")} / ${String(view.length).padStart(2, "0")}`;
}

tabs.onclick = e => {
  const b = e.target.closest(".tab");
  if (!b) return;
  folder = b.dataset.f;
  tabs.querySelector(".active").classList.remove("active");
  b.classList.add("active");
  filter();
};

gallery.onclick = e => {
  const card = e.target.closest(".card");
  if (!card) return;
  if (e.target.closest("[data-copy]")) copyURL(card._f.path);
  else if (e.target.closest(".thumb")) { showAt(view.indexOf(card._f)); lightbox.showModal(); }
};

$("prev").onclick = () => showAt(current - 1);
$("next").onclick = () => showAt(current + 1);
$("lb-close").onclick = () => lightbox.close();
lightbox.onclick = e => { if (e.target === lightbox || e.target.classList.contains("stage")) lightbox.close(); };
lightbox.onclose = () => lbImg.removeAttribute("src");
addEventListener("keydown", e => {
  if (!lightbox.open) return;
  if (e.key === "ArrowLeft") showAt(current - 1);
  else if (e.key === "ArrowRight") showAt(current + 1);
});
search.oninput = filter;

load();
</script>
</body>
</html>
